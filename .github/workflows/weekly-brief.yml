name: Weekly Brief

on:
  # TEMPORARY: testing every 5 minutes
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date for the brief (YYYY-MM-DD), defaults to today'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch-quote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set date variable
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Fetch random quote from quotable.io
        id: quote
        run: |
          response=$(curl -sf -m 10 "https://api.quotable.io/random") || true
          if [ -n "$response" ]; then
            quote_text=$(echo "$response" | jq -r '.content')
            quote_author=$(echo "$response" | jq -r '.author')
            echo "quote_text=$quote_text" >> "$GITHUB_OUTPUT"
            echo "quote_author=$quote_author" >> "$GITHUB_OUTPUT"
          else
            echo "quote_text=Stay focused and keep shipping." >> "$GITHUB_OUTPUT"
            echo "quote_author=Weekly Brief" >> "$GITHUB_OUTPUT"
          fi

      - name: Create reports directory
        run: mkdir -p reports

      - name: Write weekly brief to file
        run: |
          {
            echo "Weekly Brief — ${{ steps.timestamp.outputs.timestamp }}"
            echo "========================================="
            echo ""
            echo "Quote of the moment:"
            echo "  \"${{ steps.quote.outputs.quote_text }}\""
            echo "    — ${{ steps.quote.outputs.quote_author }}"
            echo ""
            echo "Source: https://quotable.io"
          } > "reports/brief-${{ steps.date.outputs.date }}-$(date -u +%H%M%S).txt"

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add reports/
          git commit -m "Weekly brief - $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
